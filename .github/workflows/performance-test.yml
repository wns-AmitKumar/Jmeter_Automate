name: JMeter Performance Test

on:
  workflow_dispatch:
    inputs:
      test_script:
        description: "Select the JMeter test script to execute"
        required: true
        type: choice
        options:
          - blazedemo.jmx
          - Booking_R1.5_MALUAT_21July_RevertChanges_UpdatedColumns.jmx

      result_file_name:
        description: "Enter the JMeter result file name"
        required: true
        type: string
        default: "results.jtl"

  push:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *"


jobs:

  performance-test:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================
      # JMETER
      # ==========================================

      - name: Install Apache JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

          echo "JMeter installed successfully"

          apache-jmeter-5.6.3/bin/jmeter --version


      # ==========================================
      # SELECT TEST SCRIPT
      # ==========================================

      - name: Select JMeter Test Script
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TEST_SCRIPT=${{ inputs.test_script }}" >> "$GITHUB_ENV"
          else
            echo "TEST_SCRIPT=blazedemo.jmx" >> "$GITHUB_ENV"
          fi

          echo "Selected test script: $TEST_SCRIPT"


      # ==========================================
      # INSTALL APPPIAN JARS
      # ==========================================

      - name: Install Appian JAR Files
        run: |

          JAR_DIRECTORY="jars"
          JMETER_EXT="apache-jmeter-5.6.3/lib/ext"

          echo "=========================================="
          echo "Installing Appian JAR files"
          echo "=========================================="

          if [ ! -d "$JAR_DIRECTORY" ]; then
            echo "ERROR: Appian JAR directory does not exist:"
            echo "$JAR_DIRECTORY"
            exit 1
          fi

          cp "$JAR_DIRECTORY/AppianJsonParser-20.2.0-SNAPSHOT.jar" "$JMETER_EXT/"
          cp "$JAR_DIRECTORY/ApacheJMeter_http.jar" "$JMETER_EXT/"

          echo "JAR files installed successfully."


      # ==========================================
      # VERIFY JARS
      # ==========================================

      - name: Verify Appian JAR Installation
        run: |

          JMETER_EXT="apache-jmeter-5.6.3/lib/ext"

          test -f "$JMETER_EXT/AppianJsonParser-20.2.0-SNAPSHOT.jar"
          test -f "$JMETER_EXT/ApacheJMeter_http.jar"

          echo "Both Appian JAR files are installed successfully."


      # ==========================================
      # RUN JMETER
      # ==========================================

      - name: Run JMeter Test
        run: |

          mkdir -p reports

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RESULT_FILE="${{ inputs.result_file_name }}"
          else
            RESULT_FILE="results.jtl"
          fi

          echo "=========================================="
          echo "JMeter Performance Test"
          echo "=========================================="
          echo "Test Script : $TEST_SCRIPT"
          echo "Result File : $RESULT_FILE"
          echo "=========================================="

          apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t "jmeter/$TEST_SCRIPT" \
            -l "$RESULT_FILE" \
            -e \
            -o reports

          echo "RESULT_FILE=$RESULT_FILE" >> "$GITHUB_ENV"

          echo "JMeter test completed successfully."


      # ==========================================
      # PREPARE CUSTOM DASHBOARD
      # ==========================================

      - name: Prepare Custom Dashboard
        if: always()
        run: |

          mkdir -p custom-dashboard

          cp -r dashboard/* custom-dashboard/

          echo "Dashboard files:"
          find custom-dashboard -type f


      # ==========================================
      # COPY JTL INTO DASHBOARD
      # ==========================================

      - name: Add JTL to Custom Dashboard
        if: always()
        run: |

          if [ -f "$RESULT_FILE" ]; then

            cp "$RESULT_FILE" custom-dashboard/results.jtl

            echo "JTL copied to dashboard:"
            ls -lh custom-dashboard/results.jtl

          else

            echo "JTL file not found."

          fi


      # ==========================================
      # UPLOAD JMETER REPORT
      # ==========================================

      - name: Upload JMeter HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JMeter-HTML-Report
          path: reports/


      # ==========================================
      # UPLOAD CUSTOM DASHBOARD
      # ==========================================

      - name: Upload Custom Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JMeter-Custom-Dashboard
          path: custom-dashboard/


      # ==========================================
      # UPLOAD JTL
      # ==========================================

      - name: Upload JTL Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JMeter-JTL
          path: ${{ env.RESULT_FILE }}
