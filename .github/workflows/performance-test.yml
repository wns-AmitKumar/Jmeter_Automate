name: JMeter Performance Test

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      test_script:
        description: 'Select the JMeter test script to execute'
        required: true
        type: choice
        options:
          - blazedemo.jmx
          - Booking_R1.5_MALUAT_21July_RevertChanges_UpdatedColumns.jmx

      result_file_name:
        description: 'Enter the JMeter result file name'
        required: true
        type: string
        default: 'results.jtl'

      jar_set:
        description: 'Select the custom JAR set'
        required: true
        type: choice
        default: 'none'
        options:
          - none
          - appian
          - other-tool

  # Run automatically when code is pushed to main
  push:
    branches:
      - main

  # Run every day at 02:00 UTC
  schedule:
    - cron: '0 2 * * *'


jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # Install Apache JMeter
      - name: Install Apache JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz


      # Verify Repository Files
      - name: Verify Repository Files
        run: |
          echo "Current Directory:"
          pwd

          echo ""
          echo "Repository Structure:"
          ls -R


      # Select JMeter Test Script
      - name: Select JMeter Test Script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Selected test script: ${{ inputs.test_script }}"
            echo "TEST_SCRIPT=${{ inputs.test_script }}" >> "$GITHUB_ENV"
          else
            echo "Automatic execution detected."
            echo "TEST_SCRIPT=blazedemo.jmx" >> "$GITHUB_ENV"
          fi


      # Select Custom JAR Set
      - name: Select Custom JAR Set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JAR_SET="${{ inputs.jar_set }}"
          else
            JAR_SET="none"
          fi

          echo "JAR_SET=$JAR_SET" >> "$GITHUB_ENV"
          echo "Selected JAR set: $JAR_SET"


      # Install Custom JAR Files
      - name: Install Custom JAR Files
        run: |
          if [ "$JAR_SET" = "none" ]; then
            echo "No custom JAR files required."
            exit 0
          fi

          JAR_DIRECTORY="jars/$JAR_SET"

          if [ ! -d "$JAR_DIRECTORY" ]; then
            echo "ERROR: JAR directory does not exist: $JAR_DIRECTORY"
            exit 1
          fi

          if [ "$JAR_SET" = "appian" ]; then
            APPIAN_JAR="$JAR_DIRECTORY/AppianJsonParser-20.2.0-SNAPSHOT.jar"
            JMETER_HTTP_JAR="$JAR_DIRECTORY/ApacheJMeter_http.jar"

            echo "Checking required Appian JAR files..."

            if [ ! -f "$APPIAN_JAR" ]; then
              echo "ERROR: Required JAR not found: $APPIAN_JAR"
              exit 1
            fi

            if [ ! -f "$JMETER_HTTP_JAR" ]; then
              echo "ERROR: Required JAR not found: $JMETER_HTTP_JAR"
              exit 1
            fi

            echo "Installing Appian JAR files:"
            echo " - AppianJsonParser-20.2.0-SNAPSHOT.jar"
            echo " - ApacheJMeter_http.jar"

            cp "$APPIAN_JAR" apache-jmeter-5.6.3/lib/ext/
            cp "$JMETER_HTTP_JAR" apache-jmeter-5.6.3/lib/ext/
          else
            echo "Installing JAR files from $JAR_DIRECTORY"
            cp "$JAR_DIRECTORY"/*.jar apache-jmeter-5.6.3/lib/ext/
          fi

          echo ""
          echo "Installed JAR files:"
          ls -lh apache-jmeter-5.6.3/lib/ext/*.jar


      # Verify Appian JAR Installation
      - name: Verify Appian JAR Installation
        if: env.JAR_SET == 'appian'
        run: |
          echo "Verifying Appian JAR installation..."

          test -f apache-jmeter-5.6.3/lib/ext/AppianJsonParser-20.2.0-SNAPSHOT.jar || {
            echo "ERROR: AppianJsonParser JAR was not installed."
            exit 1
          }

          test -f apache-jmeter-5.6.3/lib/ext/ApacheJMeter_http.jar || {
            echo "ERROR: ApacheJMeter_http.jar was not installed."
            exit 1
          }

          echo "Both Appian-related JAR files are installed successfully."


      # Run JMeter Test
      - name: Run JMeter Test
        run: |
          mkdir -p reports

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RESULT_FILE="${{ inputs.result_file_name }}"
          else
            RESULT_FILE="results.jtl"
          fi

          echo "========================================="
          echo "JMeter Performance Test"
          echo "========================================="
          echo "Test Script : $TEST_SCRIPT"
          echo "Result File : $RESULT_FILE"
          echo "JAR Set     : $JAR_SET"
          echo "========================================="

          apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t "jmeter/$TEST_SCRIPT" \
            -l "$RESULT_FILE" \
            -e \
            -o reports

          echo "RESULT_FILE=$RESULT_FILE" >> "$GITHUB_ENV"


      # Upload HTML Report
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JMeter-HTML-Report
          path: reports/


      # Upload JTL Results
      - name: Upload JTL Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JMeter-JTL
          path: ${{ env.RESULT_FILE }}
