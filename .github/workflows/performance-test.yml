name: JMeter Performance Test

on:
  workflow_dispatch:
    inputs:
      test_script:
        description: "Select the JMeter test script to execute"
        required: true
        type: choice
        options:
          - blazedemo.jmx
          - Booking_R1.5_MALUAT_21July_RevertChanges_UpdatedColumns.jmx

      result_file_name:
        description: "Enter the JMeter result file name"
        required: true
        type: string
        default: "results.jtl"

  push:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *"


jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      - name: Install Apache JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

          echo "JMeter installed successfully"
          apache-jmeter-5.6.3/bin/jmeter --version


      - name: Select JMeter Test Script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TEST_SCRIPT=${{ inputs.test_script }}" >> "$GITHUB_ENV"
          else
            echo "TEST_SCRIPT=blazedemo.jmx" >> "$GITHUB_ENV"
          fi

          echo "Selected test script: ${{ inputs.test_script }}"


      - name: Install Appian JAR Files
        run: |
          JAR_DIRECTORY="jars"
          JMETER_EXT="apache-jmeter-5.6.3/lib/ext"

          echo "=========================================="
          echo "Installing Appian JAR files"
          echo "=========================================="

          if [ ! -d "$JAR_DIRECTORY" ]; then
            echo "ERROR: Appian JAR directory does not exist:"
            echo "$JAR_DIRECTORY"
            exit 1
          fi

          echo "JAR directory found:"
          ls -lh "$JAR_DIRECTORY"

          echo "Copying Appian JAR files to JMeter lib/ext..."

          cp "$JAR_DIRECTORY/AppianJsonParser-20.2.0-SNAPSHOT.jar" "$JMETER_EXT/"
          cp "$JAR_DIRECTORY/ApacheJMeter_http.jar" "$JMETER_EXT/"

          echo "JAR files installed successfully."

          echo "Installed Appian JAR files:"
          ls -lh "$JMETER_EXT/AppianJsonParser-20.2.0-SNAPSHOT.jar"
          ls -lh "$JMETER_EXT/ApacheJMeter_http.jar"


      - name: Verify Appian JAR Installation
        run: |
          JMETER_EXT="apache-jmeter-5.6.3/lib/ext"

          echo "=========================================="
          echo "Verifying Appian JAR installation"
          echo "=========================================="

          if [ ! -f "$JMETER_EXT/AppianJsonParser-20.2.0-SNAPSHOT.jar" ]; then
            echo "ERROR: AppianJsonParser-20.2.0-SNAPSHOT.jar not found"
            exit 1
          fi

          if [ ! -f "$JMETER_EXT/ApacheJMeter_http.jar" ]; then
            echo "ERROR: ApacheJMeter_http.jar not found"
            exit 1
          fi

          echo "Both Appian JAR files are installed successfully."


      - name: Run JMeter Test
        run: |
          mkdir -p reports

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RESULT_FILE="${{ inputs.result_file_name }}"
          else
            RESULT_FILE="results.jtl"
          fi

          echo "=========================================="
          echo "JMeter Performance Test"
          echo "=========================================="
          echo "Test Script : $TEST_SCRIPT"
          echo "Result File : $RESULT_FILE"
          echo "=========================================="

          apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t "jmeter/$TEST_SCRIPT" \
            -l "$RESULT_FILE" \
            -e \
            -o reports

          echo "RESULT_FILE=$RESULT_FILE" >> "$GITHUB_ENV"

          echo "JMeter test completed successfully."


      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JMeter-HTML-Report
          path: reports/


      - name: Upload JTL Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JMeter-JTL
          path: ${{ env.RESULT_FILE }}
